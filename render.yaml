# Despliegue en Render como Web Service en el plan gratis.
# El plan gratis exige un puerto abierto: lo cubre el servidor de salud de src/servidor.ts,
# que responde 200 "OK" en "/" (lo que Render usa como healthCheckPath).
services:
  - type: web
    name: bot-send-oxxo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false # se escribe a mano en el panel de Render (secreto)
      - key: ALLOWED_GROUP_ID
        sync: false # se escribe a mano en el panel de Render
      - key: PAYMENT_LINKS
        sync: false # el JSON de los links, en una sola línea (ver README)
      - key: HEADLESS
        value: "true"
      - key: LOG_UPDATES
        value: "false"
    # PORT lo inyecta Render automáticamente; el servidor de salud lo lee (10000 por defecto).
